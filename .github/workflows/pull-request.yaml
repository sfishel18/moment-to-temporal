name: Pull Request

on:
  pull_request:
    branches:
      - main

jobs:
  integration-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: pnpm/action-setup@v4
      with:
        version: 10.33.0
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'pnpm'
    - name: Install dependencies
      run: pnpm install
    - name: Run tests
      run: pnpm run test

  mutation-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: pnpm/action-setup@v4
      with:
        version: 10.33.0
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'pnpm'
    - name: Install dependencies
      run: pnpm install
    # Fails if the mutation score drops below thresholds.break (95) in
    # stryker.config.json
    - name: Run mutation tests
      run: pnpm run test:mutation
    - name: Upload mutation report
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: mutation-report
        path: reports/mutation/mutation.html
